openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: seo
    description: SEO content generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /seo/generate:
    post:
      operationId: generateSeo
      tags: [seo]
      summary: Generate SEO content for a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoInput"
      responses:
        "200":
          description: Generated SEO content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SeoInput:
      type: object
      required:
        - serviceName
      properties:
        serviceName:
          type: string
          minLength: 1
          maxLength: 200
        language:
          type: string
          description: Language for generated content (ar or en)
          default: "ar"
        tone:
          type: string
          enum: [professional, friendly, persuasive]
          default: "professional"
        provider:
          type: string
          enum: [openai, gemini, qwen, zhipu]
          default: "openai"
          description: AI provider to use for generation
    SeoResult:
      type: object
      required:
        - title
        - metaDescription
        - keywords
        - slogan
        - ogTitle
        - ogDescription
        - twitterTitle
        - twitterDescription
        - canonicalSlug
        - faqItems
      properties:
        title:
          type: string
        metaDescription:
          type: string
        keywords:
          type: array
          items:
            type: string
        slogan:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        twitterTitle:
          type: string
        twitterDescription:
          type: string
        canonicalSlug:
          type: string
        faqItems:
          type: array
          items:
            $ref: "#/components/schemas/FaqItem"
    FaqItem:
      type: object
      required:
        - question
        - answer
      properties:
        question:
          type: string
        answer:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
