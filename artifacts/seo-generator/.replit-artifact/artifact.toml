kind = "web"
previewPath = "/"
title = "SEO Generator"
version = "1.0.0"
id = "artifacts/seo-generator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18531

[services.development]
run = "pnpm --filter @workspace/seo-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seo-generator", "run", "build" ]
serve = "static"
publicDir = "artifacts/seo-generator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18531"
BASE_PATH = "/"
